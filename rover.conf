# All pins are BCM (not BOARD!)

[DRIVER]
# Speed values can be adjusted to make the rover move better on different surfaces:
# Softer surfaces like carpets provide more resistance, so higher values for things
# like tank turning would make it move better on carpets. The default values seem
# to work ok for both hard and soft surfaces.

# Rover straight speed, between 0 and 1
Straightaway=1
# Rover straight speed in slow mode
StraightawaySlow=0.2
# Gradual turn, speed of the side on the inside of a turn
HalfTurnUndersteer=0.2
# Gradual turn, speed of both sides is offset by this value in slow mode
HalfTurnSlowFactor=0.4
# Rover turn-in-place speed
TankTurnSpeed=0.7
# Rover turn-in-place speed in slow mode
TankTurnSpeedSlow=0.35
# Value between -1 and 1, adjusting speed of each side relative to one another,
# 0 being no adjustment, negative numbers reducing the overall speed of the left side
# and positive numbers reducing the overall speed of the right side 
Trim=0
# The browser will send a heartbeat every second, and the rover will respond with internal stats, such as WiFi strength.
# Maximum heartbeat interval determines how long the rover will wait for a heartbeat before it stops. This prevents the rover
# from driving away if it leaves the WiFi range.
MaxHeartbeatInvervalS=2.5
# Arrow-key speeds above are scaled into the motor limit (MAX_SPEED in motorcontroller.py). A moving track gets at
# least this fraction of it, so slow mode and the slow track of a gradual turn do not stall. Raise it if they do.
MinPower=0.3
EnablePin=13
PWMFrequency=100

[LEFTMOTOR]
ForwardPin=25
ReversePin=24

[RIGHTMOTOR]
ForwardPin=17
ReversePin=27

[SERVO]
PWMPin=P0
# Min restricts the camera movement up, as direction is reversed due to geared coupling
Min=-70
# Max restricts the camera movement down
Max=90
Neutral=40

[VIDEO]
# picamera2: the server opens the camera itself, streams it to Janus and can run follow mode.
# external: GStreamerStartCommand streams the camera instead (video only, follow mode unavailable).
# If picamera2 fails to start, the server falls back to GStreamerStartCommand on its own.
CameraSource=picamera2
GStreamerStartCommand=/home/pi/server/video.sh
JanusStartCommand=/opt/janus/bin/janus -F /opt/janus/etc/janus/
# Used with CameraSource=picamera2. The stream goes to the same Janus RTP port as video.sh.
Width=1280
Height=720
Framerate=30
Bitrate=4000000
StreamHost=127.0.0.1
StreamPort=8004
# Size of the frames used for follow mode. Keep the same 16:9 shape as the stream so positions line up.
VisionWidth=320
VisionHeight=180

[FOLLOW]
# Target colour as an OpenCV HSV range (hue 0-179). The default is blue.
HueLow=100
HueHigh=140
SatLow=150
SatHigh=255
ValLow=50
ValHigh=255
# Ignore blobs smaller than this radius, as a fraction of the frame height.
MinRadius=0.04
# Follow loop rate in Hz.
LoopHz=15
# Target radius (fraction of frame height) to hold: smaller drives closer, larger keeps more distance.
TargetSize=0.12
# Horizontal error (-1..1) and relative size error below which the rover holds still.
CenterDeadband=0.08
SizeDeadband=0.15
# Turning: proportional and derivative gains on the horizontal error, and the turn limit (fraction of motor limit).
TurnKp=0.9
TurnKd=0.05
MaxTurn=0.7
# Driving: gain on the size error and forward/reverse limits (fractions of the motor limit).
ForwardKp=1.2
MaxForward=0.7
MaxReverse=0.3
# With the target this far off-centre the rover only turns; closer to the centre it drives more.
TurnBeforeDrive=0.5
# Minimum wheel power while moving (fraction of the motor limit), for motors that stall at low power.
MinPower=0.3
# Tilt servo speed (degrees/second) at full vertical error. Set TiltDirection=-1 if the camera tilts away from the
# target, TiltSpeed=0 to keep the tilt still.
TiltSpeed=60
TiltDirection=1
TiltDeadband=0.1
# How quickly the tracked position follows new detections (1 = no smoothing).
Smoothing=0.6
# Seconds without the target before it counts as lost; the rover holds still while waiting.
LostTimeout=0.5
# Once lost, turn towards the side the target was last seen at this speed for SearchDuration seconds (0 = no search).
SearchTurn=0
SearchDuration=3
# Stop following below this battery percentage (0 = no check; the reading falls back to 0% without a voltage cache).
MinBatteryPercent=0

[AUDIO]
# {} is replaced with the shell-quoted text. Piper reads it from stdin and streams raw audio; -r must match the
# voice's sample rate (22050 Hz for tr_TR-dfki-medium, see "sample_rate" in the model's .onnx.json).
TTSCommand=echo {} | piper --model /opt/piper_models/tr_TR-dfki-medium.onnx --output_raw | aplay -q -r 22050 -f S16_LE -c 1 -t raw -
Greeting=Emrinizdeyim Efendim
# Played at the start of the boot animation, before the greeting. Relative to the repository; leave empty for none.
# Any WAV works; regenerate the default with tools/make_startup_sound.py.
StartupSound=sounds/startup.wav
# Command used to play sound files; {} is replaced with the file path.
SoundCommand=aplay -q {}
# A map between 0-5 steps that are available in the Web UI and the volume that should be set in alsamixer
VolumeSteps={"0": 0, "1": 50, "2": 65, "3": 75, "4": 85, "5": 100}
# Wait this many seconds after the motors or the servo are supposed to stop moving before restoring recording volume
VolumeRestoreDelay=0.5

[LIGHTS]
# Colour (hex RGB) and APA102 global brightness (0-31) of the headlights at startup; both can be changed from the
# control page until the next restart.
Color=FFFFFF
Brightness=31

[POWERPLANT]
# The powerplant will stop operating if battery voltage falls below this value, in millivolts
CutoffVoltage=3200
# Battery level and charging state come from the Fusion HAT driver's power supply. When it is missing, the voltage
# is read from VoltageCachePath instead (no charging state then).
SupplyPath=/sys/class/power_supply/fusion-hat
VoltageCachePath=/home/pi/.battery_voltage_cache

[OFFCHARGER]
# When enabled, the rover will detect when it's moved off the charger without it driving.
# When that happens, the rover will say "Off Charger" and drive forward for 1 second.
# This allows it to re-dock with the charger if it's accidentally knocked off it.
Enabled=False
# In seconds, how long after last motion should this functionality kick in
GracePeriod=5
# In seconds, how long after Off Charger is detected (after grace period) should
# the rover attempt to re-dock. Should be at least 20 seconds, since the power plant
# occasionally recalibrates the battery measurements and does not report the charging status
InitialDelay = 25
